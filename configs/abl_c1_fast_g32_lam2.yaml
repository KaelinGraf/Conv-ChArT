# C1-FAST composite (222,138 + 401 params). Stacks the two identity levers measured at THIS width that cost nothing on localisation: gate_skips [3,2] (+1.99 pp M-04, p95 0.7611->0.7429, tail unchanged) and lambda_cls 2.0 (+3.04 pp, p95 0.7580, tail 0.0218->0.0168%). hm=focal cls=BCE is DELIBERATELY EXCLUDED despite its +1.95 pp: it pays 0.061 px of p95 and 5.8x the >4px tail for that identity, and inverts at 882k. Comparator: abl_fast_ce_35k_rev6 (0.7611 / 94.76% / 0.0218%).
# CUT FROM configs/abl_nodilate_width_quarter_xsa_s05.yaml by tools/cut_ablation.py -- do not hand-edit; regenerate.
# Changes EXACTLY 1 key(s): loss_form=ce.
# The one-key invariant below was verified programmatically at cut time; re-run this
# command after ANY edit to configs/abl_nodilate_width_quarter_xsa_s05.yaml.
#
# A-FAST-CE (Kaelin 2026-07-31): does one-hot BCE degrade as representational capacity falls?
# Kaelin's hypothesis: a large model can afford BCE because it does not need the stabilisation that
# focal's penalty-reduced Gaussian provides; a small one does. This is the 222,138-param rung of that
# test. Its matched control is abl_fast_ctrl35k_rev6 -- the SAME config on a fresh 35k cosine, NOT the
# shipped FAST run (which was scheduled 30k then extended to 45k, so it is not schedule-matched).
# 
# NOTE, and it matters for reading this arm: dcc/losses.py strict_bce uses ONLY (y == 1.0), so a
# loss_form=ce arm is INVARIANT to sigma_hm -- the Gaussian's graded values never enter the loss. The
# sigma 0.5 in this config therefore affects nothing but the loader's target tensors (which is why it
# still counts as a loader key for pairing). The CE result is the same at any sigma.
