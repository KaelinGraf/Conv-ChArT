# 
# DELIBERATELY MULTI-KEY, unlike every attribution arm before it. Its purpose is not to isolate a
# mechanism -- that work is done -- but to place a POINT ON THE PARETO FRONTIER using the levers
# already proven: nodilate (matched the reference for -25% params), one-hot BCE (beat focal at
# every width measured: -0.038 px p95 / +0.43 pp M-04 at 882k, -0.049 px / -0.11 pp at 222k), and
# attention-block count as the size dial. Every arm in the ladder shares that base and differs only
