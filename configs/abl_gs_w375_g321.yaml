# CUT FROM configs/abl_t_w375_a2_ce.yaml by tools/cut_ablation.py -- do not hand-edit; regenerate.
# Changes EXACTLY 1 key(s): gate_skips=[3, 2, 1].
# The one-key invariant below was verified programmatically at cut time; re-run this
# command after ANY edit to configs/abl_t_w375_a2_ce.yaml.
#
# MULTI-SKIP GATING (Kaelin 2026-08-01: "could we try adding gates on all 3 for the small model to
# see if that helps?"). The 640 variant has THREE skips -- s3 @H/4 (gated), s2 @H/2, s1 @H (both
# ungated). Only the deepest was ever gated, on the spec's argument that a wrong veto is recoverable
# at H/4 via the lattice recovery pass but not in the shallow layers carrying sub-pixel position.
# 
# The gates-off ladder overturns that FOR SMALL MODELS: removing gate3 is mildly BENEFICIAL at 882k
# and 502k (-0.002/-0.006 px p95, +0.20/+0.25 pp M-04 at matched steps) but costs about -15 pp M-04
# at 222k. The gate is load-bearing exactly where capacity is scarce, so more gates may help there.
# 
# MODULATION SIGNAL is the classic Attention-U-Net cascade -- each gate is driven by the coarser
# DECODER feature it is about to be concatenated with (gate2 <- d3's output, gate1 <- d2's output),
# not by the attention bottleneck z. gate3 alone is driven by z. Feeding upsampled z to all three is
# a DIFFERENT experiment, deliberately deferred (Kaelin: "I suspect this may make attention too load
# bearing") -- it would make z a single point of failure for every skip, which is a ROBUSTNESS
# question for the sweep, not an accuracy question for val.
# CAPACITY CONTROL at 502,322 params. gates-off HELPED here, so if the capacity story is right this
# arm should be neutral-or-worse while the 222k ones improve. Without it, a 222k gain could be read
# as 'more gates are just better' rather than 'gates substitute for capacity'.
