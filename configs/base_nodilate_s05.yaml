# *** CANONICAL BASELINE (Kaelin, 2026-07-30) *** "we have happily taken dilation = false,
# and sigma = 0.5 as the baseline."
#
# THIS FILE IS THE BASE EVERY NEW ARM IS CUT FROM. It is configs/rev640.yaml plus exactly
# the two adopted keys, verified programmatically (see the invariant check below). It is NOT
# itself an ablation and has no factor under test.
#
#   e4_dilated: false   A-NODILATE finished 50k at M-04 99.01% vs the reference 99.14%
#                       (inside the +/-0.15 pp noise band), m01 median identical to 4 dp,
#                       p95 slightly BETTER, for 1,180,672 fewer params (-25.1%). The
#                       dilated (2,4) pair is vestigial: it was the Rev B spec's board-scale
#                       context mechanism, which the attention bottleneck now provides.
#   sigma_hm: 0.5       The sigma ladder settled it on final m01 p95: 2.0 -> 0.8189,
#                       1.0 -> 0.7366, 0.5 -> 0.7070. Hyperparameter tuning, not a claim.
#
# WHY A SEPARATE BASE FILE AT ALL. dcc/dataset.py:18 load_config is a bare yaml.safe_load --
# there is NO overlay or inheritance, so every arm config is a full ~240-line copy. That is
# exactly how the 2026-07-29 incident happened: arms cut from a pre-rev-6 base silently
# differed in 10 keys, conv-only trained on easier data and "beat" the reference, costing an
# hour of GPU and producing a false architectural finding. Cutting from ONE verified base is
# the cheap structural fix.
#
# INVARIANT, RE-RUN AFTER ANY EDIT TO THIS FILE OR TO rev640.yaml:
#   env PYTHONPATH= python -c "
#   import sys; sys.path.insert(0,'.')
#   from dcc.dataset import load_config
#   r=load_config('configs/rev640.yaml'); b=load_config('configs/base_nodilate_s05.yaml')
#   d=sorted(k for k in set(r)|set(b) if r.get(k)!=b.get(k))
#   assert d==['e4_dilated','sigma_hm'], d"
#
# NOTE rev640.yaml OMITS e4_dilated and width_mult and relies on the code defaults
# (dcc/model.py:325-330: e4_dilated True, width_mult 1.0). This file therefore sets
# e4_dilated explicitly and leaves width_mult absent, so the key-level diff is exactly the
# two adopted keys and nothing cosmetic. Arms that vary width set width_mult themselves.
e4_dilated: false
input_size: [640, 480]
sigma_hm: 0.5
sigma_cls: 1.0
alpha: 2
beta: 4
lambda_cls: 1.0
tau_hm: 0.3
tau_id: 0.5
lattice_tol_px: 3.0
negative_p: 0.05
scale_range_px: [12, 128]
refiner_jitter_px: 4
freeze_trunk: false
attend_div: 8
attn_blocks: 2
attn_heads: 8
rope_lambda_min_cells: 2.5
xsa: false
board:
  squares: [5, 5]
  dictionary: DICT_5X5_50
  marker_ids: [0, 11]
  marker_ratio: 0.7
  square_length_m: null
synth:
  render_res: 480
  backgrounds: /home/kaelin/datasets/coco/train2017
  val_seed: 1000
  train_seed: 2000
  pose_seed: 3000
  val_size: 10000
  refiner_res_mult: 2.5
  refiner_max_corners: 8
  refiner_val_composites: 1250
  refiner_generic_frac: 0.0
  refiner_full_frac: 0.08
  rot_deg: 180
  shear_deg: 35
  translate_frac: 0.45
  perspective_p: 0.8
  tilt_max_deg: 60
  fov_scale: [0.7, 1.4]
  bg_hflip_p: 0.5
  prefilter:
    enabled: true
    k: 0.5
  occlusion:
    p: 0.55
    holes: [1, 6]
    size: [16, 64]
  cutouts:
    path: /home/kaelin/datasets/cutouts
    p: 0.5
    max_objects: 3
    scale: [0.08, 0.5]
  integration:
    relight_enabled: true
    relight_sigma_frac: 0.125
    relight_clip: [0.45, 1.7]
    feather_px: 0.9
    shadow_enabled: true
    shadow_offset_frac: [0.005, 0.03]
    shadow_strength: [0.15, 0.5]
  photometric:
    gauss_noise_p: 0.5
    noise_std: [3.2, 7.1]
    sensor_noise_enabled: true
    sensor_noise_electrons_per_dn: [3.0, 30.0]
    sensor_noise_read_std: [1.0, 3.0]
    motion_blur_p: 0.5
    motion_blur_kmax: 5
    gauss_blur_p: 0.25
    speckle_p: 0.0
    speckle_std: [0.03, 0.12]
    mult_noise_p: 0.5
    mult_noise_range: [0.98, 1.02]
    brightness_p: 0.5
    brightness_range: [-0.6, 0.3]
    brightness_add_floor: -0.58
    contrast_p: 0.5
    contrast_range: [0.8, 1.2]
    rgb_shift_p: 0.5
    rgb_shift_limit: 10
    glare_peak: [30, 130]
    glare_p: 0.25
    ghost_p: 0.25
    ghost_alpha: [0.05, 0.2]
    ghost_shift_px: [1, 4]
    specular_p: 0.15
    specular_strength: [30, 150]
    specular_exponent: [20, 200]
    specular_spread_frac: [0.08, 0.2]
    droplet_p: 0.1
    droplet_n: [1, 4]
    droplet_mode_b_p: 0.5
    droplet_bokeh_radius: [4, 18]
    droplet_bokeh_brightness: [40, 220]
    droplet_refractive_radius: [6, 20]
    droplet_refractive_minify: [0.15, 0.4]
    droplet_refractive_alpha: [0.6, 0.9]
    droplet_refractive_blur_sigma: [2, 4]
    droplet_hole_alpha_thresh: 0.7
    droplet_hole_radius_thresh: 8
    vignette_p: 0.5
    vignette_strength: [0.05, 0.25]
    ink_contrast_p: 0.3
    ink_contrast_scale: [1.0, 1.3]
    differencing_p: 0.10
    differencing_ambient: [0.05, 0.95]
    differencing_illum_peak: [0.25, 0.9]
    differencing_autoexposure: true
    differencing_ae_target: 250.0
    differencing_illum_floor: [0.05, 0.3]
    differencing_illum_sigma_frac: [0.25, 0.45]
    differencing_shift_px: [0.2, 3.0]
    dark_greyout_white_thresh: 25
    dark_greyout_brightness_thresh: -0.9
    dark_greyout_blend: [0.3, 0.7]
    fpn_p: 0.3
    fpn_col_std: [0.3, 1.2]
