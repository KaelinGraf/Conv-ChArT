# 640x480 fast-baseline arm (attend_div=8, 4-stage encoder, H/8 attention): the
# A1/A9 ablation platform, measured 140-142 samples/s vs native's 25.9. scale_range_px
# below is in INPUT px like default.yaml's, but since input_size differs the physical
# (sensor-plane) distance envelope it covers differs too -- intentional, this arm is
# for the resolution-comparison study, not a physical-scale match to the native config.
input_size: [640, 480]
sigma_hm: 2.0
sigma_cls: 1.0
alpha: 2
beta: 4
lambda_cls: 1.0
tau_hm: 0.3
tau_id: 0.5
lattice_tol_px: 3.0
negative_p: 0.05
scale_range_px: [12, 128]
refiner_jitter_px: 4
freeze_trunk: false
attend_div: 8
attn_blocks: 2
attn_heads: 8
rope_lambda_min_cells: 2.5
board:
  squares: [5, 5]
  dictionary: DICT_5X5_50
  marker_ids: [0, 11]
  marker_ratio: 0.7
  square_length_m: null
synth:
  render_res: 480
  backgrounds: /home/kaelin/datasets/coco/train2017
  val_seed: 1000
  train_seed: 2000
  pose_seed: 3000
  val_size: 10000
  refiner_res_mult: 2.5
  refiner_max_corners: 8
  refiner_val_composites: 1250
  refiner_generic_frac: 0.0
  refiner_full_frac: 0.08
  rot_deg: 180
  shear_deg: 35
  translate_frac: 0.45
  perspective_p: 0.8
  tilt_max_deg: 60
  fov_scale: [0.7, 1.4]
  bg_hflip_p: 0.5
  prefilter:
    enabled: true
    k: 0.5
  occlusion:
    p: 0.4
    holes: [1, 6]
    size: [16, 64]
  cutouts:
    path: /home/kaelin/datasets/cutouts
    p: 0.35
    max_objects: 3
    scale: [0.08, 0.5]
  photometric:
    gauss_noise_p: 0.5
    noise_std: [3.2, 7.1]
    motion_blur_p: 0.5
    motion_blur_kmax: 5
    gauss_blur_p: 0.25
    speckle_p: 0.5
    speckle_std: [0.03, 0.12]
    mult_noise_p: 0.5
    mult_noise_range: [0.95, 1.05]
    brightness_p: 0.5
    brightness_range: [-0.98, 0.35]
    brightness_add_floor: -0.96
    contrast_p: 0.5
    contrast_range: [0.8, 1.2]
    rgb_shift_p: 0.5
    rgb_shift_limit: 20
    glare_p: 0.3
    ghost_p: 0.25
    ghost_alpha: [0.1, 0.5]
    ghost_shift_px: [1, 4]
train:
  batch: 16
  accum: 2
  steps: 250000
  lr: 3.0e-4
  lr_floor: 3.0e-6
  warmup_steps: 1000
  wd: 1.0e-4
  clip_norm: 5.0
  ema_decay: 0.999
  workers: 12
  prefetch_factor: 4
  val_every: 2500
  full_val_every: 25000
  val_subset: 2000
  match_px: 8.0
  tau_hm: 0.3
  wandb:
    enabled: true
    project: conv-chart
    mode: online
  early_stop:
    enabled: true
    patience: 3
    min_steps: 162000
    tail_gate: 0.01
refiner_train:
  batch: 256
  steps: 10000
  lr: 1.0e-3
  lr_floor: 1.0e-5
  warmup_steps: 200
  wd: 1.0e-4
  clip_norm: 5.0
  ema_decay: 0.999
  workers: 12
  val_every: 1000
